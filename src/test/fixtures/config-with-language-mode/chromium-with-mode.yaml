version: "1.0"
name: "Chromium log with language mode"
description: "Test configuration with changeLanguageMode enabled"

detector:
  type: "first-line"
  pattern: "\\[[0-9]+:[0-9]+:[0-9]+/[0-9]+\\.[0-9]+:(INFO|WARNING|ERROR|FATAL):[^\\]]+\\].*"
  changeLanguageMode: true

matchers:
  - name: "Error Messages"
    type: "error"
    severity: "high"
    pattern: '(error|fail|exception|crash)'
    color: "#FF4444"
    minimap: true
    description: "Lines containing error-related keywords"
    ignoreCase: true
    icon: "$(error)"

filePatterns:
  - "*chromium-log*"
  - "*.log"