version: "1.0"
name: "Chromium log configuration"
description: "Basic configuration for Chromium log file analysis"

detector:
  type: "first-line"
  # Simple pattern to match Chromium log lines
  pattern: "^\\[.*\\] .*$"
  # Flag to change language mode of a file to "log" when this detector matches
  changeLanguageMode: true

# Match common log file extensions
filePatterns:
  - "*.log"
  - "*.out"
  - "*.txt"

# Generate file links based on patterns
fileLinks:
  - pattern: "^\\[.*:([^:]+):(\\d+)\\]"
    fileUri: "$1"
    lineNumber: "$2"
    # Do not search for files in whole workspace
    # glob search can be slow on large workspaces
    allowSearch: false
    # Use specified paths for relative file search
    # If empty, workspace root is used
    paths:
    - .
    - .logconfig

# Simple matchers for common patterns
matchers:
  # Basic error detection
  - name: "Error Messages"
    type: "error"
    severity: "high"
    pattern: '(error|fail|exception|crash)'
    ignorePattern: 'flaky'
    minimap: true
    description: "Lines containing error-related keywords"
    ignoreCase: true
    icon: "$(error)"
    includeInCount: true
    
  - name: "Warning Messages"
    enabled: true
    type: "warning"
    severity: "medium"
    pattern: '(warning|warn|caution|alert)'
    minimap: true
    description: "Lines containing warning-related keywords"
    ignoreCase: true
    icon: "$(warning)"
    includeInCount: true
    
  - name: "Success Messages"
    type: "success"
    severity: "low"
    pattern: '(success|complete|done|passed)'
    minimap: false
    description: "Lines indicating successful operations"
    ignoreCase: true
    icon: "$(check)"
    
  # Common log levels
  - name: "Fatal/Critical"
    type: "fatal"
    severity: "critical"
    pattern: '(fatal|critical|severe)'
    minimap: true
    description: "Critical errors and fatal conditions"
    ignoreCase: true
    icon: "$(error)"
    
  # Common issues
  - name: "Timeout Issues"
    type: "timeout"
    severity: "medium"
    pattern: '(timeout|timed out|time.*out)'
    minimap: true
    description: "Timeout-related issues"
    ignoreCase: true
    icon: "$(watch)"
    
  - name: "Connection Issues"
    type: "connection"
    severity: "medium"
    pattern: '(connection.*failed|connection.*refused|connection.*lost|disconnected)'
    minimap: true
    description: "Network connection problems"
    ignoreCase: true
    icon: "$(plug)"

  - name: "Disabled matcher"
    enabled: false
    type: "specific thing"
    severity: "medium"
    pattern: '(something)'
    minimap: true
    description: "Matcher that is currently not needed"
    ignoreCase: true
    icon: "$(plug)"

# Simple grouping
groups:
  - name: "Critical Issues"
    description: "Fatal errors and critical problems"
    matchers: ["fatal", "error"]
    icon: "$(error)"
    color: "#0000FF"
    priority: 1
    
  - name: "Warnings & Issues"
    description: "Warnings and non-critical issues"
    matchers: ["warning", "timeout", "connection"]
    icon: "$(warning)"
    priority: 2

# Conservative performance settings
performance:
  maxLinesPerAnalysis: 25000
  analysisTimeout: 30
  cacheResults: true
  debounceInterval: 500
