name: Publish to Open VSX Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-and-publish:
    name: Test, build and publish to Open VSX Registry 📦
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build extension for production
        run: npm run package

      - name: Package VSIX
        run: vsce package --no-git-tag-version

      - name: Publish to Open VSX Registry
        run: npx ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
